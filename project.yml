name: TrustStoreHelper
options:
  bundleIdPrefix: com.truststore
targets:
  TrustStoreHelper:
    type: application
    platform: iOS
    deploymentTarget: 14.0
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [truststoreimport]
        NSPhotoLibraryAddUsageDescription: NeedsPhotoAccess
